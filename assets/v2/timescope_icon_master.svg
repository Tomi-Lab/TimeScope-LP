<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ======================================================= -->
  <!-- TimeScope Application Icon Master (Editable Vector SVG)  -->
  <!-- Core Metaphor: Calendar Grid x 3 Timeline Bars          -->
  <!-- Organized into 10 independently editable layers         -->
  <!-- ======================================================= -->
  <defs>
    <filter id="soft-glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="26" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow-hero" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="b1"/>
      <feGaussianBlur stdDeviation="34" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rim-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a2a54"/>
      <stop offset="60%" stop-color="#03122c"/>
      <stop offset="100%" stop-color="#010614"/>
    </radialGradient>
    <linearGradient id="bar1-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8cfce6"/>
      <stop offset="35%" stop-color="#3cebe1"/>
      <stop offset="70%" stop-color="#12b9e4"/>
      <stop offset="100%" stop-color="#0f87de"/>
    </linearGradient>
    <linearGradient id="bar2-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2debfe"/>
      <stop offset="28%" stop-color="#00c3fc"/>
      <stop offset="50%" stop-color="#0096fd"/>
      <stop offset="70%" stop-color="#285af6"/>
      <stop offset="85%" stop-color="#5f3aef"/>
      <stop offset="100%" stop-color="#a034ee"/>
    </linearGradient>
    <linearGradient id="bar3-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78a5fa"/>
      <stop offset="35%" stop-color="#555fe6"/>
      <stop offset="70%" stop-color="#563cd7"/>
      <stop offset="100%" stop-color="#aa32f0"/>
    </linearGradient>
    <linearGradient id="squircle-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82d4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3ca8f8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6cc2ff" stop-opacity="0.72"/>
    </linearGradient>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g id="icon-canvas" clip-path="url(#squircle-clip)">
    <!-- 1. Background gradient -->
    <g id="layer-1-background-gradient">
      <rect width="1024" height="1024" fill="#020819"/>
      <rect width="1024" height="1024" fill="url(#bg-radial)"/>
    </g>

    <!-- 2. Calendar grid – horizontal lines -->
    <g id="layer-2-grid-horizontal-lines" stroke="#80d2ff" stroke-opacity="0.32" stroke-width="2.4">
      <line x1="50" y1="265" x2="974" y2="265"/>
      <line x1="50" y1="418" x2="974" y2="418"/>
      <line x1="50" y1="570" x2="974" y2="570"/>
      <line x1="50" y1="725" x2="974" y2="725"/>
      <line x1="50" y1="860" x2="974" y2="860"/>
    </g>

    <!-- 3. Calendar grid – vertical lines -->
    <g id="layer-3-grid-vertical-lines" stroke="#80d2ff" stroke-opacity="0.32" stroke-width="2.4">
      <line x1="120" y1="80" x2="120" y2="950"/>
      <line x1="272" y1="80" x2="272" y2="950"/>
      <line x1="438" y1="80" x2="438" y2="950"/>
      <line x1="604" y1="80" x2="604" y2="950"/>
      <line x1="770" y1="80" x2="770" y2="950"/>
      <line x1="932" y1="80" x2="932" y2="950"/>
    </g>

    <!-- 4. Grid intersection markers -->
    <g id="layer-4-grid-intersection-markers">
      <circle cx="120" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="272" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="438" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="604" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="770" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="932" cy="265" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="120" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="272" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="438" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="604" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="770" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="932" cy="418" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="120" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="272" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="438" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="604" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="770" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="932" cy="570" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="120" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="272" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="438" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="604" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="770" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="932" cy="725" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="120" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="272" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="438" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="604" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="770" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
      <circle cx="932" cy="860" r="2.6" fill="#e6faff" fill-opacity="0.78"/>
    </g>

    <!-- 5. Calendar header markers (5 day tabs) -->
    <g id="layer-5-calendar-header-markers" fill="#3e74b4" fill-opacity="0.62">
      <rect x="167" y="197" width="58" height="20" rx="10"/>
      <rect x="326" y="197" width="58" height="20" rx="10"/>
      <rect x="492" y="197" width="58" height="20" rx="10"/>
      <rect x="658" y="197" width="58" height="20" rx="10"/>
      <rect x="822" y="197" width="58" height="20" rx="10"/>
    </g>

    <!-- 6. Timeline bar 1 (Upper Right) -->
    <g id="layer-6-timeline-bar-1">
      <rect x="626" y="330" width="398" height="84" rx="42" fill="url(#bar1-gradient)" filter="url(#soft-glow-cyan)"/>
      <rect x="626" y="330" width="398" height="84" rx="42" fill="url(#bar1-gradient)"/>
    </g>

    <!-- 7. Timeline bar 2 (Middle Hero) -->
    <g id="layer-7-timeline-bar-2">
      <rect x="182" y="475" width="698" height="94" rx="47" fill="url(#bar2-gradient)" filter="url(#soft-glow-hero)"/>
      <rect x="182" y="475" width="698" height="94" rx="47" fill="url(#bar2-gradient)"/>
    </g>

    <!-- 8. Timeline bar 3 (Lower Left) -->
    <g id="layer-8-timeline-bar-3">
      <rect x="84" y="636" width="442" height="84" rx="42" fill="url(#bar3-gradient)" filter="url(#soft-glow-cyan)"/>
      <rect x="84" y="636" width="442" height="84" rx="42" fill="url(#bar3-gradient)"/>
    </g>

    <!-- 9. Glow and lighting effects -->
    <g id="layer-9-glow-lighting-effects" pointer-events="none">
      <ellipse cx="530" cy="522" rx="420" ry="70" fill="url(#bar2-gradient)" opacity="0.18" filter="url(#soft-glow-hero)"/>
    </g>

    <!-- 10. Optional logo and tagline layers -->
    <g id="layer-10-logo-tagline" display="none" font-family="system-ui, -apple-system, sans-serif">
      <text x="512" y="940" text-anchor="middle" font-size="48" font-weight="bold" fill="#ffffff">TimeScope</text>
      <text x="512" y="980" text-anchor="middle" font-size="24" fill="#a0c8e8">See time. Instantly.</text>
    </g>
  </g> <!-- end icon-canvas -->

  <!-- Container: Subtle rounded-square glass edge -->
  <g id="squircle-rim" pointer-events="none">
    <rect x="24" y="24" width="976" height="976" rx="224" ry="224" fill="none" stroke="url(#squircle-rim-grad)" stroke-width="1.8"/>
  </g>
</svg>